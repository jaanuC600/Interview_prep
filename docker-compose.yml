version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: interview_prep_db
    environment:
      POSTGRES_USER: interview_user
      POSTGRES_PASSWORD: interview_password
      POSTGRES_DB: interview_prep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview_network

  redis:
    image: redis:7-alpine
    container_name: interview_prep_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interview_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_prep_backend
    environment:
      DATABASE_URL: postgresql://interview_user:interview_password@postgres:5432/interview_prep
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - interview_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: interview_prep_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - interview_network

volumes:
  postgres_data:
  redis_data:

networks:
  interview_network:
    driver: bridge
